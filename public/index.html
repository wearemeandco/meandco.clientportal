<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Me&Co. &middot; Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1E45FB; --blue-ink: #0B1F8F; --oxford: #0A2342; --paper: #FAF8F2; --paper-ink: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background: var(--paper);
    color: var(--paper-ink); text-align: center; padding: 2rem;
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--blue-ink); font-weight: 700; margin: 0 0 0.5rem;
  }
  h1 { font-family: 'Syne', sans-serif; font-weight: 800; color: var(--oxford); margin: 0; }
  p { color: #5a5648; margin: 0.8rem 0 0; }
</style>
</head>
<body>
  <div>
    <p class="kicker">Me&Co.</p>
    <h1>Client Portal</h1>
    <p>Your portal lives at a private link sent directly to you.</p>
  </div>
</body>
</html>
